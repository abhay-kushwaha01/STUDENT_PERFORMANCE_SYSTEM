<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analysis</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">SPAS<span>Student Performance Analysis</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><div id="pageSubtitle" class="muted"></div></div></div><section class="content"><div class="card"><div class="toolbar"><select class="select" id="student" style="max-width:340px"></select><button class="btn" onclick="loadAnalysis()">Analyze</button></div></div><div id="result" style="display:none"><div class="grid cards"><div class="card"><div class="muted">Overall</div><div class="kpi" id="overall"></div></div><div class="card"><div class="muted">Strongest Score</div><div class="kpi" id="high"></div></div><div class="card"><div class="muted">Weakest Score</div><div class="kpi" id="low"></div></div><div class="card"><div class="muted">Category</div><div class="kpi" id="cat" style="font-size:22px"></div></div></div><div class="two"><div class="card"><h3>Subject Analysis</h3><div id="subjectBars" class="chart"></div></div><div class="card"><h3>Recommendations</h3><div id="recs"></div></div></div></div></section></main></div><script src="/js/app.js"></script><script>nav('analysis');layoutTitle('Performance Analysis','Transparent rule-based analysis generated by C');async function init(){const ss=await API.get('/api/students');student.innerHTML=ss.map(s=>`<option value="${s.student_id}">${s.name} (${s.student_id})</option>`).join('');loadAnalysis()}async function loadAnalysis(){const r=await API.get('/api/analysis/'+student.value);result.style.display='block';overall.textContent=r.summary.overall.toFixed(1)+'%';high.textContent=r.summary.highest.toFixed(1)+'%';low.textContent=r.summary.lowest.toFixed(1)+'%';cat.textContent=r.summary.category;subjectBars.innerHTML=r.subjects.map(x=>`<div class="bar" style="height:${Math.max(8,x.percentage)}%"><span>${x.percentage.toFixed(0)}</span><em>${x.subject.split(' ')[0]}</em></div>`).join('');recs.innerHTML=r.recommendations.map(x=>`<div style="padding:10px;border-bottom:1px solid var(--border)">• ${x}</div>`).join('')}init();</script></body></html>
