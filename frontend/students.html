<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">SPAS<span>Student Performance Analysis</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><div id="pageSubtitle" class="muted"></div></div><div class="toolbar" style="margin:0"><button class="btn" onclick="openAdd()">+ Add Student</button><button class="btn secondary" onclick="location.href='/analysis'">Analyze Performance</button></div></div><section class="content"><div class="card"><div class="toolbar"><input id="search" class="input" style="max-width:350px" placeholder="Search name, roll number, department"><select id="sort" class="select" style="max-width:220px"><option value="name">Sort by Name</option><option value="roll">Roll Number</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Roll</th><th>Name</th><th>Department</th><th>Semester</th><th>Section</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal" id="modal"><div class="modal-box"><div class="toolbar"><h2 style="margin-right:auto" id="modalTitle">Add Student</h2><button class="btn secondary" onclick="closeModal()">Close</button></div><form id="studentForm"><div class="form-grid"><div class="field"><label>Student ID</label><input class="input" name="student_id" type="number" required></div><div class="field"><label>Roll Number</label><input class="input" name="roll_no" required></div><div class="field"><label>Name</label><input class="input" name="name" required></div><div class="field"><label>Email</label><input class="input" name="email"></div><div class="field"><label>Phone</label><input class="input" name="phone"></div><div class="field"><label>Gender</label><select class="select" name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Date of Birth</label><input class="input" name="dob" type="date"></div><div class="field"><label>Department</label><input class="input" name="department" required></div><div class="field"><label>Course</label><input class="input" name="course" value="BTech"></div><div class="field"><label>Semester</label><input class="input" name="semester" type="number" min="1" max="12" value="3"></div><div class="field"><label>Section</label><input class="input" name="section" value="A"></div><div class="field"><label>Admission Year</label><input class="input" name="admission_year" type="number" value="2026"></div></div><button class="btn" style="margin-top:18px">Save Student</button></form></div></div><div class="toast" id="toast"></div><script src="/js/app.js"></script><script>nav('students');layoutTitle('Students','Add your own students, enter performance data, and analyze results');let editing=false;async function load(){const data=await API.get('/api/students?q='+encodeURIComponent(search.value));rows.innerHTML=data.map(s=>`<tr><td>${s.student_id}</td><td>${s.roll_no}</td><td><strong>${s.name}</strong></td><td>${s.department}</td><td>${s.semester}</td><td>${s.section}</td><td><button class="btn secondary" onclick="editStudent(${s.student_id})">Edit</button> <button class="btn danger" onclick="delStudent(${s.student_id})">Delete</button> <button class="btn" onclick="location.href='/student-profile?id=${s.student_id}'">Profile</button><button class="btn secondary" onclick="location.href='/marks?student_id=${s.student_id}'">Marks</button><button class="btn secondary" onclick="location.href='/attendance?student_id=${s.student_id}'">Attendance</button></td></tr>`).join('')}async function editStudent(id){const r=await API.get('/api/students/'+id);editing=true;modalTitle.textContent='Edit Student';for(const [k,v] of Object.entries(r.student)){const el=studentForm.elements[k];if(el)el.value=v}modal.classList.add('show')}function openAdd(){editing=false;studentForm.reset();modalTitle.textContent='Add Student';modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}studentForm.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(studentForm).entries());for(const k of ['student_id','semester','admission_year'])data[k]=Number(data[k]);const r=await API.post(editing?'/api/students/update':'/api/students/add',data);toast(r.message);if(r.success){closeModal();load();if(!editing&&confirm('Student added. Do you want to enter marks and attendance now?'))location.href='/student-profile?id='+data.student_id}});async function delStudent(id){if(!confirm('Delete this student?'))return;const r=await API.post('/api/students/delete',{student_id:id});toast(r.message);if(r.success)load()}search.addEventListener('input',load);sort.addEventListener('change',load);load();</script></body></html>
