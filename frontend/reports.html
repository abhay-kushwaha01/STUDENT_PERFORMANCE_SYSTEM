<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">SPAS<span>Student Performance Analysis</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><div id="pageSubtitle" class="muted"></div></div></div><section class="content"><div class="two"><div class="card"><h2>Student Report</h2><p class="muted">Generate a detailed marks, attendance and recommendation report.</p><select class="select" id="student"></select><button class="btn" style="margin-top:14px" onclick="studentReport()">Download Report</button></div><div class="card"><h2>Class Report</h2><p class="muted">Generate a class-level performance summary.</p><button class="btn" onclick="location.href='/api/reports/class'">Download Class Report</button></div></div><div class="card" style="margin-top:18px"><h2>Subject Report</h2><p class="muted">Generate a subject-level summary.</p><div class="toolbar"><select class="select" id="subject" style="max-width:300px"></select><button class="btn" onclick="subjectReport()">Download Subject Report</button></div></div></section></main></div><script src="/js/app.js"></script><script>nav('reports');layoutTitle('Reports','Download C-generated performance reports');async function init(){const ss=await API.get('/api/students');student.innerHTML=ss.map(s=>`<option value="${s.student_id}">${s.name} (${s.student_id})</option>`).join('');const ms=await API.get('/api/marks?student_id='+ss[0].student_id);subject.innerHTML=[...new Set(ms.map(x=>x.subject))].map(x=>`<option>${x}</option>`).join('')}function studentReport(){location.href='/api/reports/student/'+student.value}function subjectReport(){location.href='/api/reports/subject?subject='+encodeURIComponent(subject.value)}init();</script></body></html>
