<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">SPAS<span>Student Performance Analysis</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><div id="pageSubtitle" class="muted"></div></div><button class="btn" onclick="openAdd()">+ Add Attendance</button></div><section class="content"><div class="card"><div class="toolbar"><select class="select" id="student" style="max-width:300px"></select><button class="btn secondary" onclick="loadRows()">Load</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>Present</th><th>Total</th><th>Absent</th><th>%</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal" id="modal"><div class="modal-box"><div class="toolbar"><h2 style="margin-right:auto">Add Attendance</h2><button class="btn secondary" onclick="modal.classList.remove('show')">Close</button></div><form id="form"><div class="form-grid"><div class="field"><label>Student</label><select class="select" name="student_id" id="formStudent"></select></div><div class="field"><label>Subject</label><input class="input" name="subject" required></div><div class="field"><label>Total Classes</label><input class="input" name="total_classes" type="number" min="1" required></div><div class="field"><label>Classes Attended</label><input class="input" name="classes_attended" type="number" min="0" required></div></div><button class="btn" style="margin-top:18px">Save Attendance</button></form></div></div><div class="toast" id="toast"></div><script src="/js/app.js"></script><script>nav('attendance');layoutTitle('Attendance','Track attendance and low-attendance warnings');async function init(){const ss=await API.get('/api/students');student.innerHTML=ss.map(s=>`<option value="${s.student_id}">${s.name} (${s.student_id})</option>`).join('');formStudent.innerHTML=student.innerHTML;const pre=q('student_id');if(pre&&ss.some(s=>String(s.student_id)===pre))student.value=pre;formStudent.value=student.value;loadRows()}async function loadRows(){const ar=await API.get('/api/attendance?student_id='+student.value);rows.innerHTML=ar.map(a=>`<tr><td>${a.subject}</td><td>${a.classes_attended}</td><td>${a.total_classes}</td><td>${a.classes_absent}</td><td>${a.percentage.toFixed(1)}%</td><td>${badge(a.percentage<75?'At Risk':'On Track')}</td><td><button class="btn danger" onclick="delAtt(${a.id})">Delete</button></td></tr>`).join('')}function openAdd(){formStudent.value=student.value;modal.classList.add('show')}form.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form).entries());['student_id','total_classes','classes_attended'].forEach(k=>d[k]=Number(d[k]));const r=await API.post('/api/attendance/add',d);toast(r.message);if(r.success){modal.classList.remove('show');loadRows()}});async function delAtt(id){const r=await API.post('/api/attendance/delete',{id});toast(r.message);loadRows()}student.addEventListener('change',loadRows);init();</script></body></html>
