<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Profile</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">SPAS<span>Student Performance Analysis</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><div id="pageSubtitle" class="muted"></div></div><button class="btn secondary" onclick="history.back()">Back</button></div><section class="content"><div class="card profile-head"><div><h2 id="name" style="margin:0 0 6px"></h2><div id="meta" class="muted"></div></div><div class="toolbar" style="margin:0"><button class="btn secondary" onclick="location.href='/marks?student_id='+id">+ Add / Edit Marks</button><button class="btn secondary" onclick="location.href='/attendance?student_id='+id">+ Add / Edit Attendance</button><button class="btn" onclick="downloadReport()">Download Report</button></div></div><div class="grid cards"><div class="card"><div class="muted">Overall</div><div id="overall" class="kpi">—</div></div><div class="card"><div class="muted">Average Marks</div><div id="avg" class="kpi">—</div></div><div class="card"><div class="muted">Attendance</div><div id="att" class="kpi">—</div></div><div class="card"><div class="muted">Category</div><div id="cat" class="kpi" style="font-size:22px">—</div></div></div><div class="two"><div class="card"><h3>Subject Performance</h3><div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>%</th><th>Grade</th></tr></thead><tbody id="subjects"></tbody></table></div></div><div class="card"><h3>Recommendations</h3><div id="recs" class="muted"></div><h3 class="section-title">Attendance</h3><div class="table-wrap"><table class="table"><tbody id="atts"></tbody></table></div></div></div></section></main></div><script src="/js/app.js"></script><script>nav('students');layoutTitle('Student Profile','Detailed academic performance');const id=q('id');async function load(){const r=await API.get('/api/analysis/'+id);if(!r.success)return;name.textContent=r.student.name;meta.textContent=`${r.student.id} • ${r.student.roll_no} • ${r.student.department}`;overall.textContent=r.summary.overall.toFixed(1)+'%';avg.textContent=r.summary.average.toFixed(1)+'%';att.textContent=r.summary.attendance.toFixed(1)+'%';cat.textContent=r.summary.category;subjects.innerHTML=r.subjects.length?r.subjects.map(x=>`<tr><td>${x.subject}</td><td>${x.percentage.toFixed(1)}%</td><td>${badge(x.grade)}</td></tr>`).join(''):`<tr><td colspan="3" class="empty">No marks recorded yet. Use <strong>+ Add / Edit Marks</strong>.</td></tr>`;atts.innerHTML=r.attendance_records.length?r.attendance_records.map(x=>`<tr><td>${x.subject}</td><td>${x.percentage.toFixed(1)}%</td></tr>`).join(''):`<tr><td colspan="2" class="empty">No attendance recorded yet. Use <strong>+ Add / Edit Attendance</strong>.</td></tr>`;recs.innerHTML=r.recommendations.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)">• ${x}</div>`).join('')}function downloadReport(){location.href='/api/reports/student/'+id}load();</script></body></html>
