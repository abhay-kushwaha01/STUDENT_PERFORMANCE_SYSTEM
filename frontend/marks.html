<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marks</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">SPAS<span>Student Performance Analysis</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><div id="pageSubtitle" class="muted"></div></div><button class="btn" onclick="openAdd()">+ Add Marks</button></div><section class="content"><div class="card"><div class="toolbar"><select class="select" id="student" style="max-width:300px"></select><button class="btn secondary" onclick="loadMarks()">Load</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>Internal</th><th>External</th><th>Practical</th><th>Total</th><th>%</th><th>Grade</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal" id="modal"><div class="modal-box"><div class="toolbar"><h2 style="margin-right:auto">Add Marks</h2><button class="btn secondary" onclick="modal.classList.remove('show')">Close</button></div><form id="form"><div class="form-grid"><div class="field"><label>Student</label><select class="select" name="student_id" id="formStudent"></select></div><div class="field"><label>Subject</label><input class="input" name="subject" required></div><div class="field"><label>Internal Marks</label><input class="input" type="number" step="0.01" name="internal_marks" required></div><div class="field"><label>External Marks</label><input class="input" type="number" step="0.01" name="external_marks" required></div><div class="field"><label>Practical Marks</label><input class="input" type="number" step="0.01" name="practical_marks" required></div><div class="field"><label>Maximum Marks</label><input class="input" type="number" name="max_marks" value="100" required></div></div><button class="btn" style="margin-top:18px">Save Marks</button></form></div></div><div class="toast" id="toast"></div><script src="/js/app.js"></script><script>nav('marks');layoutTitle('Marks','Enter and manage subject-wise marks');async function init(){const ss=await API.get('/api/students');student.innerHTML=ss.map(s=>`<option value="${s.student_id}">${s.name} (${s.student_id})</option>`).join('');formStudent.innerHTML=student.innerHTML;const pre=q('student_id');if(pre&&ss.some(s=>String(s.student_id)===pre))student.value=pre;formStudent.value=student.value;loadMarks()}async function loadMarks(){const sid=student.value;if(!sid)return;const ms=await API.get('/api/marks?student_id='+sid);rows.innerHTML=ms.map(m=>`<tr><td>${m.subject}</td><td>${m.internal_marks}</td><td>${m.external_marks}</td><td>${m.practical_marks}</td><td>${m.total_marks}</td><td>${m.percentage}%</td><td>${badge(m.grade)}</td><td><button class="btn danger" onclick="delMark(${m.id})">Delete</button></td></tr>`).join('')}function openAdd(){formStudent.value=student.value;modal.classList.add('show')}form.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form).entries());['student_id','internal_marks','external_marks','practical_marks','max_marks'].forEach(k=>d[k]=Number(d[k]));const r=await API.post('/api/marks/add',d);toast(r.message);if(r.success){modal.classList.remove('show');loadMarks()}});async function delMark(id){const r=await API.post('/api/marks/delete',{id});toast(r.message);loadMarks()}student.addEventListener('change',loadMarks);init();</script></body></html>
